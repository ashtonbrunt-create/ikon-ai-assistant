<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKON Roofing — AI Operations Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Barlow:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #C8102E;
    --brand-dark: #9B0C23;
    --ink: #141414;
    --ink-soft: #5E5E5E;
    --paper: #F7F6F4;
    --card: #FFFFFF;
    --line: #E4E2DE;
    --err: #C03B3B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }
  header { background: var(--ink); color: #fff; padding: 16px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: .08em; }
  .brand-name span { color: var(--brand); }
  .brand-sub { font-size: 12px; color: #A8A8A8; margin-top: 1px; letter-spacing: .02em; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 10px; letter-spacing: .08em; border: 1px solid #3A3A3A; color: #C9C9C9; padding: 4px 9px; border-radius: 3px; white-space: nowrap; }
  .badge.accent { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 500; }
  .tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab { font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 14px; padding: 13px 18px; color: var(--ink-soft); cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; transition: color .12s; user-select: none; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--brand); }
  main { max-width: 780px; margin: 0 auto; padding: 26px 18px 60px; }
  .tool-title { font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 20px; margin-bottom: 4px; }
  .tool-desc { font-size: 13px; color: var(--ink-soft); margin-bottom: 22px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
  label { display: block; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 6px; }
  .field { margin-bottom: 16px; }
  input[type=text], select, textarea { width: 100%; padding: 10px 12px; font-size: 14px; font-family: inherit; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }
  textarea { min-height: 90px; resize: vertical; line-height: 1.55; }
  .gen-btn { font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .03em; background: var(--brand); color: #fff; border: none; border-radius: 6px; padding: 12px 26px; cursor: pointer; transition: background .12s; width: 100%; }
  .gen-btn:hover { background: var(--brand-dark); }
  .gen-btn:disabled { opacity: .55; cursor: not-allowed; }
  @media (min-width: 561px) { .gen-btn { width: auto; } }
  .output { margin-top: 20px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--brand); border-radius: 6px; padding: 18px 20px; display: none; }
  .output.visible { display: block; }
  .output-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
  .output-label { font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); }
  .copy { font-size: 12px; background: none; border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer; color: var(--ink-soft); }
  .copy:hover { border-color: var(--brand); color: var(--brand-dark); }
  #out-text { font-size: 14px; line-height: 1.7; }
  #out-text.error { color: var(--err); white-space: pre-wrap; }
  #out-text p { margin-bottom: 10px; white-space: pre-wrap; }
  #out-text p:last-child { margin-bottom: 0; }
  #out-text .section-head { font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: .1em; color: var(--brand-dark); margin: 18px 0 4px; display: block; }
  .demo-note { font-size: 11px; color: var(--ink-soft); background: var(--paper); border: 1px dashed var(--line); border-radius: 5px; padding: 6px 10px; margin-bottom: 12px; display: none; }
  .demo-note.visible { display: block; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 7px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { text-align: center; font-size: 12px; color: var(--ink-soft); padding: 20px; line-height: 1.6; }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand-name">IKON <span>ROOFING</span></div>
    <div class="brand-sub">AI operations assistant · Northern Utah</div>
  </div>
  <div class="badges">
    <span class="badge accent">GAF MASTER ELITE</span>
    <span class="badge">INTERNAL TOOL</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main>
  <h1 class="tool-title" id="tool-title"></h1>
  <p class="tool-desc" id="tool-desc"></p>
  <div class="panel" id="form-panel"></div>
  <div class="output" id="output">
    <div class="output-bar">
      <span class="output-label" id="out-label">Output</span>
      <button class="copy" onclick="copyOut()">Copy</button>
    </div>
    <div class="demo-note" id="demo-note">Sample output (demo mode) — live AI generation activates once the tool is deployed.</div>
    <div id="out-text"></div>
  </div>
</main>

<footer>
  IKON Roofing · (801) 573-6010 · American Fork, UT<br>
  Outputs are drafts written in IKON's voice — review before sending.
</footer>

<script>
const TOOLS = {
  proposal: {
    name: "Proposal",
    desc: "Customer-ready proposal in IKON's voice, with GAF Master Elite positioning built in.",
    fields: [
      { id: "customer", label: "Customer name", type: "text", ph: "Jensen residence" },
      { id: "address",  label: "Job address",   type: "text", ph: "1240 E 300 N, American Fork UT", pair: true },
      { id: "rooftype", label: "Roof type", type: "select", options: ["Asphalt shingle – residential","Metal standing seam","Flat TPO – commercial","Tile re-roof","Storm damage repair"] },
      { id: "sqft", label: "Approx. square footage", type: "text", ph: "2,600 sq ft", pair: true },
      { id: "notes", label: "Key job notes", type: "textarea", ph: "Full tear-off, replace damaged decking on south slope, GAF Timberline HDZ Charcoal, ice & water shield at eaves and valleys, new pipe boots and ridge vent" },
      { id: "price", label: "Estimated price range", type: "text", ph: "$15,800 – $17,400" },
      { id: "rep", label: "Sales rep name", type: "text", ph: "Brandon", pair: true },
    ],
  },
  followup: {
    name: "Follow-up",
    desc: "Customer follow-up email — neighborly, honest, never pushy.",
    fields: [
      { id: "name", label: "Customer name", type: "text", ph: "Linda Sorensen" },
      { id: "type", label: "Follow-up type", type: "select", options: ["Post-estimate (no decision yet)","Post-job thank you","Insurance claim follow-up","Referral request","Inspection reminder"], pair: true },
      { id: "context", label: "Context / notes", type: "textarea", ph: "Inspected hail damage last Thursday in Lehi, walked her through the insurance process, estimate sent same day, adjuster meeting still pending" },
      { id: "rep", label: "Your name (signature)", type: "text", ph: "Brandon" },
    ],
  },
  handoff: {
    name: "Job handoff",
    desc: "Sales-to-production summary so the crew starts with the full picture.",
    fields: [
      { id: "name", label: "Customer name", type: "text", ph: "Christensen family" },
      { id: "date", label: "Scheduled date", type: "text", ph: "June 22, 2026", pair: true },
      { id: "scope", label: "Sold scope", type: "textarea", ph: "Full tear-off, GAF Timberline HDZ Weathered Wood, replace 3 sheets decking NE corner, new drip edge all sides, reflash chimney" },
      { id: "crew", label: "Special notes for crew", type: "textarea", ph: "Steep pitch on back — harness work. Customer WFH, keep driveway clear until 9am. Trampoline needs moving. HOA: no work before 7am." },
    ],
  },
  scope: {
    name: "Scope of work",
    desc: "Full SOW from rough notes — customer, crew, or insurance versions.",
    fields: [
      { id: "bullets", label: "Bullet points or rough notes", type: "textarea", ph: "- Tear off 1 layer arch shingle\n- Replace damaged decking as needed\n- Synthetic underlayment\n- I&W valleys, eaves, penetrations\n- GAF Timberline HDZ Pewter Gray\n- Ridge vent + matching ridge cap" },
      { id: "for", label: "Intended for", type: "select", options: ["Customer-facing contract","Internal crew reference","Insurance supplement"] },
      { id: "formal", label: "Formality", type: "select", options: ["Formal / contractual","Plain language"], pair: true },
    ],
  },
  notes: {
    name: "Job notes",
    desc: "Raw field notes in, clean professional summary out.",
    fields: [
      { id: "raw", label: "Raw field notes", type: "textarea", ph: "on site 7am, tear off done by 1030, found soft decking around swamp cooler curb replaced 2 sheets, wind picked up after lunch slowed shingle install, finished front + west slope, back slope and ridge tomorrow, customer asked about gutter quote — told them we'd send one" },
    ],
  },
  training: {
    name: "Ask a question",
    desc: "Internal process answers for new and existing team members.",
    fields: [
      { id: "question", label: "Your question", type: "textarea", ph: "A homeowner's insurance only approved a partial roof replacement but the whole roof has matching damage. What's our process?" },
      { id: "role", label: "Your role", type: "select", options: ["New estimator","Office staff","Project manager","Field crew lead"] },
    ],
  },
};

const DEMO = {
  proposal: `ROOFING PROPOSAL
Jensen Residence | 1240 E 300 N, American Fork UT | Prepared by Brandon

OVERVIEW
At IKON Roofing, we believe a roof should be built right the first time. As a GAF Master Elite certified contractor — a distinction held by fewer than 2% of roofing contractors in North America — we hold ourselves to a standard most companies simply can't match. We're a Northern Utah company, and we've seen what Utah weather does to roofs over time. Every project we take on is built to handle it.

SCOPE OF WORK
1. Full tear-off of existing roofing system down to the deck
2. Inspect and replace damaged decking on south slope
3. Install ice and water shield at all eaves and valleys
4. Install synthetic underlayment across full deck
5. Install GAF Timberline HDZ in Charcoal
6. New pipe boots and continuous ridge vent
7. Full site cleanup and magnetic nail sweep

MATERIALS
GAF Timberline HDZ architectural shingles in Charcoal, installed to GAF Master Elite standards. As a Master Elite contractor, IKON can offer enhanced GAF warranty options not available through standard installers.

INVESTMENT
Estimated investment: $15,800 – $17,400. This covers all materials, labor, debris removal, and a final walkthrough with you before we consider the job closed.

NEXT STEPS
Call or text Brandon at (801) 573-6010 to move forward. We'll confirm your material selections, finalize the details, and get you scheduled.

We're not the biggest — just the best. We'd be proud to put that on your roof.

IKON Roofing | GAF Master Elite Certified | American Fork, Utah`,

  followup: `Subject: Following up on your roof estimate

Hi Linda,

It was great meeting you in Lehi last Thursday and walking the hail damage together. I know the insurance process can feel like a lot, so I wanted to check in.

The estimate we sent reflects everything we documented, and once your adjuster meeting is scheduled, I'm happy to be there in person — it usually makes the process smoother and faster for you.

Is there a day next week that works to touch base, or have you heard back from your adjuster yet?

Either way, no pressure — we're here when you need us.

Brandon
IKON Roofing · (801) 573-6010`,

  handoff: `JOB SUMMARY
Christensen family — full tear-off and re-roof
Scheduled: June 22, 2026

SOLD SCOPE
1. Full tear-off, single layer
2. GAF Timberline HDZ Weathered Wood
3. Replace 3 sheets decking, NE corner
4. New drip edge, all sides
5. Reflash chimney

SITE & ACCESS NOTES
1. Steep pitch on back slope — harness work required
2. Keep driveway clear until 9am, customer working from home
3. Trampoline in backyard needs moving before tear-off

CUSTOMER EXPECTATIONS
1. Customer home during job — introduce crew lead on arrival
2. Gutter quote promised separately

FLAGS
1. HOA: no work before 7am — plan start time accordingly
2. Back slope harness work will slow day one`,

  scope: `SCOPE OF WORK

IKON Roofing will perform the following work to GAF Master Elite installation standards:

1. Remove existing architectural shingle roofing down to the roof deck
2. Inspect all decking and replace damaged sections as needed
3. Install ice and water shield at all valleys, eaves, and penetrations
4. Install synthetic underlayment across the full deck
5. Install GAF Timberline HDZ in Pewter Gray
6. Install continuous ridge vent with matching ridge cap
7. Full site cleanup including debris haul-away and magnetic nail sweep`,

  notes: `WORK COMPLETED
Crew on site 7am. Full tear-off completed by 10:30am. Replaced 2 sheets of decking around swamp cooler curb. Shingle installation completed on front and west slopes.

MATERIALS USED
2 sheets replacement decking at swamp cooler curb.
[CONFIRM: shingle quantities used]

ISSUES ENCOUNTERED
Soft decking found at swamp cooler curb — replaced same day. Afternoon wind slowed shingle installation on west slope.

OUTSTANDING ITEMS
1. Back slope and ridge cap scheduled for tomorrow
2. Customer requested gutter quote — needs to be sent`,

  training: `Good question — this comes up regularly with Utah hail claims.

When insurance approves only a partial replacement but the damage is roof-wide, here is the process:

1. Document everything first. Photograph matching damage on every slope before any work starts.
2. Do not accept the partial scope as final. A partial approval is a starting position, not a closed decision.
3. Prepare a supplement. Office staff drafts an insurance supplement with photo documentation and shingle matching arguments.
4. Escalate to Brandon before the adjuster re-inspection — he handles adjuster conversations on contested scopes.
5. Never tell the homeowner to accept or fight the claim decision themselves — we present the documentation and let the carrier process work.

As a new estimator, your job is steps 1 and 2. Brandon and the office handle the rest.`,
};

let activeTool = "proposal";

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  for (const key of Object.keys(TOOLS)) {
    const t = document.createElement("div");
    t.className = "tab" + (key === activeTool ? " active" : "");
    t.textContent = TOOLS[key].name;
    t.onclick = () => { activeTool = key; renderTabs(); renderForm(); hideOut(); };
    tabs.appendChild(t);
  }
}

function renderForm() {
  const tool = TOOLS[activeTool];
  document.getElementById("tool-title").textContent = tool.name;
  document.getElementById("tool-desc").textContent = tool.desc;
  const panel = document.getElementById("form-panel");
  panel.innerHTML = "";
  let i = 0;
  const fields = tool.fields;
  while (i < fields.length) {
    const f = fields[i];
    const next = fields[i + 1];
    if (next && next.pair && f.type !== "textarea" && next.type !== "textarea") {
      const row = document.createElement("div");
      row.className = "grid2";
      row.appendChild(fieldEl(f));
      row.appendChild(fieldEl(next));
      panel.appendChild(row);
      i += 2;
    } else {
      panel.appendChild(fieldEl(f));
      i += 1;
    }
  }
  const btn = document.createElement("button");
  btn.className = "gen-btn";
  btn.id = "gen-btn";
  btn.textContent = "Generate";
  btn.onclick = generate;
  panel.appendChild(btn);
}

function fieldEl(f) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  const lab = document.createElement("label");
  lab.textContent = f.label;
  lab.htmlFor = "f-" + f.id;
  wrap.appendChild(lab);
  let el;
  if (f.type === "select") {
    el = document.createElement("select");
    for (const o of f.options) {
      const opt = document.createElement("option");
      opt.textContent = o;
      el.appendChild(opt);
    }
  } else if (f.type === "textarea") {
    el = document.createElement("textarea");
    el.placeholder = f.ph || "";
  } else {
    el = document.createElement("input");
    el.type = "text";
    el.placeholder = f.ph || "";
  }
  el.id = "f-" + f.id;
  wrap.appendChild(el);
  return wrap;
}

async function generate() {
  const tool = TOOLS[activeTool];
  const btn = document.getElementById("gen-btn");
  const lines = [];
  for (const f of tool.fields) {
    const val = document.getElementById("f-" + f.id).value.trim();
    if (val) lines.push(f.label + ": " + val);
  }
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Generating…';
  showOut("", false, "Generating…", false);
  try {
    if (location.protocol === "file:") throw new Error("demo");
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tool: activeTool, input: lines.join("\n") || "(use realistic example data)" }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error("demo");
    showOut(data.text, false, tool.name, false);
  } catch (err) {
    await new Promise((r) => setTimeout(r, 900));
    showOut(DEMO[activeTool], false, tool.name, true);
  }
  btn.disabled = false;
  btn.textContent = "Generate";
}

function renderOutput(text) {
  const lines = text.split("\n");
  let html = "";
  let para = [];
  const flush = () => { if (para.length) { html += `<p>${para.join("\n")}</p>`; para = []; } };
  for (const line of lines) {
    if (/^[A-Z][A-Z\s&\/]{3,}$/.test(line.trim()) && line.trim().length < 40) {
      flush();
      html += `<span class="section-head">${line.trim()}</span>`;
    } else {
      para.push(line);
    }
  }
  flush();
  return html;
}

function showOut(text, isError, label, isDemo) {
  const out = document.getElementById("output");
  out.classList.add("visible");
  if (label) document.getElementById("out-label").textContent = label;
  document.getElementById("demo-note").classList.toggle("visible", !!isDemo);
  const t = document.getElementById("out-text");
  if (isError) {
    t.className = "error";
    t.textContent = text;
  } else {
    t.className = "";
    t.innerHTML = renderOutput(text);
  }
  t.dataset.plain = text;
}

function hideOut() { document.getElementById("output").classList.remove("visible"); }

function copyOut() {
  const t = document.getElementById("out-text");
  const text = t.dataset.plain || t.textContent;
  navigator.clipboard.writeText(text).catch(() => {});
}

renderTabs();
renderForm();
</script>
</body>
</html>
